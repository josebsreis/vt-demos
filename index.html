  <script type="application/json" id="tour-doc">{"schema":3,"id":"tour-c1ba6903","title":"Taiping Elementary School — SDGs Campus Tour","locales":{"default":"en","available":["en","zh-TW"]},"theme":{"accent":"#3b82f6","panelBg":"#111111","radius":"12px"},"tooltipStyle":{"background":"#1a1d24","backgroundOpacity":0.96,"textColor":"#ffffff","fontSize":13,"padding":8,"radius":6},"assets":[],"variables":[],"scenes":[{"id":"scene-campus","name":"Taiping Elementary School","projection":"equirect","source":{"kind":"splat","src":"models/school-3d.ply","up":[0,-1,0],"target":[0,0,0],"view":{"yaw":0,"pitch":-1.05,"distance":34,"fov":45},"limits":{"distance":[12,90],"pitch":[-1.5,-0.25]},"mode":"flyover","reveal":{"mode":"dots","dotsMs":2000,"holdMs":0,"coatMs":2000}},"initialView":{"yaw":0,"pitch":-1.15},"layers":[{"id":"layer-ea44ca70","name":"Hotspots","visible":true,"locked":false,"hotspots":[{"id":"hs-7ca6eacd","name":"Enter the school","geometry":{"kind":"point3d","x":0,"y":0,"z":0},"form":"icon","style":{"builtinIcon":"arrow","iconColor":"#ffffff","background":"#3b82f6","radius":999,"text":"","textColor":"#ffffff","fontSize":13,"size":40,"padding":9,"effect":"none","effectColor":"#3b82f6","effectOpacity":0.7,"effectSpeed":1.6,"effectSize":44,"effectStroke":2,"fill":"#3b82f6","fillOpacity":0.28,"stroke":"#3b82f6","strokeWidth":2,"color":"#ffffff"},"on":[{"event":"click","actions":[{"type":"goto","targetSceneId":"scene-3e82a2df"}]}]}]}]},{"id":"scene-3e82a2df","name":"School Gate","projection":"equirect","source":{"kind":"tiled","dir":"tiles/scene-1-school-gate-1-a8ad8bec","width":8192,"cols":8,"rows":4},"thumbnail":"thumbs/scene-3e82a2df.jpg","initialView":{"yaw":0,"pitch":0},"guide":{"text":"The \"Chencuocuo Drainage\" at our school gate is our safety hero! By exploring this local flood control system, we embody the spirit of SDG 11 (Sustainable Cities and Communities). We learn how infrastructure quickly drains water during severe weather and extreme storms, and how following disaster evacuation plans builds a safer, climate-resilient community.","avatar":"images/guide-avatar.jpg","sdgs":[11],"audio":{"en":"audio/scene-01-en.m4a","zh-TW":"audio/scene-01-zh.m4a"}},"layers":[{"id":"layer-c88fd549","name":"Hotspots","visible":true,"locked":false,"hotspots":[]}]},{"id":"scene-34f7225f","name":"The Great Banyan Tree","projection":"equirect","source":{"kind":"tiled","dir":"tiles/scene-2-the-great-banyan-tree-1-26205fd7","width":8192,"cols":8,"rows":4},"thumbnail":"thumbs/scene-34f7225f.jpg","initialView":{"yaw":0,"pitch":0},"guide":{"text":"Welcome to the embrace of our decades-old banyan tree! As a master of carbon sequestration, this guardian tree helps us explore SDG 13 (Climate Action). We learn how trees absorb carbon dioxide to mitigate global warming, inspiring us to practice a carbon-neutral and eco-friendly lifestyle.","avatar":"images/guide-avatar.jpg","sdgs":[13],"audio":{"en":"audio/scene-02-en.m4a","zh-TW":"audio/scene-02-zh.m4a"}},"layers":[{"id":"layer-c760bea1","name":"Hotspots","visible":true,"locked":false,"hotspots":[]}]},{"id":"scene-5394d213","name":"Sports Field","projection":"equirect","source":{"kind":"tiled","dir":"tiles/scene-3-sports-field-1-f9f72d87","width":8192,"cols":8,"rows":4},"thumbnail":"thumbs/scene-5394d213.jpg","initialView":{"yaw":0,"pitch":0},"guide":{"text":"Our vast playground is more than a sports field; it is a life-saving disaster drill site and a shared community space! Embodying SDG 11 (Sustainable Cities and Communities), we practice earthquake evacuation here, using it as an \"emergency assembly point.\" By opening the field to the community for resource sharing, we make Taiping Elementary a safe, inclusive, and sustainable hub.","avatar":"images/guide-avatar.jpg","sdgs":[11],"audio":{"en":"audio/scene-03-en.m4a","zh-TW":"audio/scene-03-zh.m4a"}},"layers":[{"id":"layer-01879cdf","name":"Hotspots","visible":true,"locked":false,"hotspots":[]}]},{"id":"scene-1d51c639","name":"Basketball Court","projection":"equirect","source":{"kind":"tiled","dir":"tiles/scene-4-basketball-court-1-cc8132c0","width":8192,"cols":8,"rows":4},"thumbnail":"thumbs/scene-1d51c639.jpg","initialView":{"yaw":0,"pitch":0},"guide":{"text":"Show off your skills on the court! Regular exercise is the best way to practice SDG 3 (Good Health and Well-being). Sweating it out on the basketball court boosts cardiorespiratory endurance and physical fitness. Moreover, exercise releases dopamine and endorphins in the brain to make us feel happy! Let's build strong bodies and positive minds through team sports to embrace healthy lives.","avatar":"images/guide-avatar.jpg","sdgs":[3],"audio":{"en":"audio/scene-04-en.m4a","zh-TW":"audio/scene-04-zh.m4a"}},"layers":[{"id":"layer-71094ad7","name":"Hotspots","visible":true,"locked":false,"hotspots":[]}]},{"id":"scene-81fae87e","name":"Mosaic Mural","projection":"equirect","source":{"kind":"tiled","dir":"tiles/scene-5-mosaic-mural-1-4e771d44","width":8192,"cols":8,"rows":4},"thumbnail":"thumbs/scene-81fae87e.jpg","initialView":{"yaw":0,"pitch":0},"guide":{"text":"A toilet full of art! This mosaic mural, co-created by teachers and students, perfectly blends art with SDG 6 Clean Water and Sanitation. We learn to value water and stay hygienic while beautifying our school environment .","avatar":"images/guide-avatar.jpg","sdgs":[6],"audio":{"en":"audio/scene-05-en.m4a","zh-TW":"audio/scene-05-zh.m4a"}},"layers":[{"id":"layer-a7fcae92","name":"Hotspots","visible":true,"locked":false,"hotspots":[]}]},{"id":"scene-8060da4d","name":"Agri-Food Garden","projection":"equirect","source":{"kind":"tiled","dir":"tiles/scene-6-agri-food-education-gard-42378877","width":8192,"cols":8,"rows":4},"thumbnail":"thumbs/scene-8060da4d.jpg","initialView":{"yaw":0,"pitch":0},"guide":{"text":"Taiping young farmers, let’s get to work! In our school garden, we plant and harvest to experience the joy of \"farm-to-table.\" Guided by SDG 2 (Zero Hunger), we learn about food security and the importance of valuing our food. By choosing \"locally produced seasonal food,\" we effectively reduce carbon footprints and transport costs, becoming eco-conscious, responsible eaters!","avatar":"images/guide-avatar.jpg","sdgs":[2],"audio":{"en":"audio/scene-06-en.m4a","zh-TW":"audio/scene-06-zh.m4a"}},"layers":[{"id":"layer-d0ef28d9","name":"Hotspots","visible":true,"locked":false,"hotspots":[]}]},{"id":"scene-fd0f73b6","name":"Greenhouse & Composting","projection":"equirect","source":{"kind":"tiled","dir":"tiles/scene-7-back-building-plaza-gree-44a733c2","width":8192,"cols":8,"rows":4},"thumbnail":"thumbs/scene-fd0f73b6.jpg","initialView":{"yaw":0,"pitch":0},"guide":{"text":"The greenhouse is a plant paradise! Here, we observe rich flora to practice SDG 15 (Life on Land), greening our campus to create friendly habitats and protect biodiversity. Meanwhile, we turn lunch left overs into \"food waste compost\"—transforming waste into organic fertilizer for resource recycling. This fulfills SDG 12 (Responsible Consumption and Production) by turning trash into treasure!####","avatar":"images/guide-avatar.jpg","sdgs":[15,12],"audio":{"en":"audio/scene-07-en.m4a","zh-TW":"audio/scene-07-zh.m4a"}},"layers":[{"id":"layer-8cc7cef1","name":"Hotspots","visible":true,"locked":false,"hotspots":[]}]},{"id":"scene-c21d4c68","name":"English Classroom","projection":"equirect","source":{"kind":"tiled","dir":"tiles/scene-8-english-international-cl-131b1bc7","width":8192,"cols":8,"rows":4},"thumbnail":"thumbs/scene-c21d4c68.jpg","initialView":{"yaw":0,"pitch":0},"guide":{"text":"Hello world! Welcome to our International English Classroom! Guided by our dedicated teachers, we blend bilingual learning with SDGs to provide a fun, SDG 4 (Quality Education) environment. Furthermore, our school offers free after-school care and English classes to support students in need, embodying SDG 10 (Reduced Inequalities). This ensures equal learning opportunities for every child, helping them become inspiring global citizens!","avatar":"images/guide-avatar.jpg","sdgs":[4,10],"audio":{"en":"audio/scene-08-en.m4a","zh-TW":"audio/scene-08-zh.m4a"}},"layers":[{"id":"layer-1e05dcc2","name":"Hotspots","visible":true,"locked":false,"hotspots":[]}]},{"id":"scene-6c7a40d5","name":"Health Center","projection":"equirect","source":{"kind":"tiled","dir":"tiles/scene-9-health-center-1-bf5706d6","width":8192,"cols":8,"rows":4},"thumbnail":"thumbs/scene-6c7a40d5.jpg","initialView":{"yaw":0,"pitch":0},"guide":{"text":"The Health Center cares for every student's well-being! Through our \"LOHAS Health Bulletin,\" we promote handwashing and disease prevention (such as enterovirus and flu). Our school nurse also guides us on eye care and proper teeth brushing after meals. Here, we practice SDG 3 (Good Health and Well-being) by learning to care for ourselves and others, making our campus healthy and vibrant!","avatar":"images/guide-avatar.jpg","sdgs":[3],"audio":{"en":"audio/scene-09-en.m4a","zh-TW":"audio/scene-09-zh.m4a"}},"layers":[{"id":"layer-8f00ecbf","name":"Hotspots","visible":true,"locked":false,"hotspots":[]}]},{"id":"scene-7668802a","name":"Playground & Health Trail","projection":"equirect","source":{"kind":"tiled","dir":"tiles/scene-10-playground-health-trail-5fe9ca1b","width":8192,"cols":8,"rows":4},"thumbnail":"thumbs/scene-7668802a.jpg","initialView":{"yaw":0,"pitch":0},"guide":{"text":"Put on your sneakers and let’s go! The playground is everyone's favorite recess spot, flanked by a health walkway surrounded by banyan trees, Formosan gums, and blackboard trees. Exercising here practices SDG 3 (Good Health and Well-being), building daily habits that fill us with vibrant, sustainable energy!","avatar":"images/guide-avatar.jpg","sdgs":[3],"audio":{"en":"audio/scene-10-en.m4a","zh-TW":"audio/scene-10-zh.m4a"}},"layers":[{"id":"layer-4901db59","name":"Hotspots","visible":true,"locked":false,"hotspots":[]}]},{"id":"scene-0ec3e426","name":"Dongtian Temple","projection":"equirect","source":{"kind":"tiled","dir":"tiles/scene-11-dongtian-temple-1-891936ae","width":8192,"cols":8,"rows":4},"thumbnail":"thumbs/scene-0ec3e426.jpg","initialView":{"yaw":0,"pitch":0},"guide":{"text":"Step outside to Dongtian Temple, the spiritual heart of our community! Its main hall honors the \"Five Holy Benefactors,\" while the side hall enshrines \"Wenchang Emperor,\" who governs wisdom and academic success. Exploring its history practices SDG 11 (Sustainable Cities and Communities) by protecting local cultural heritage and fostering strong ties between our school and town!","avatar":"images/guide-avatar.jpg","sdgs":[],"audio":{"en":"audio/scene-11-en.m4a","zh-TW":"audio/scene-11-zh.m4a"}},"layers":[{"id":"layer-5304a6d1","name":"Hotspots","visible":true,"locked":false,"hotspots":[]}]},{"id":"scene-b9f1857c","name":"Taiping Park","projection":"equirect","source":{"kind":"tiled","dir":"tiles/scene-12-taiping-park-1-b8799eac","width":8192,"cols":8,"rows":4},"thumbnail":"thumbs/scene-b9f1857c.jpg","initialView":{"yaw":0,"pitch":0},"guide":{"text":"The park is a natural extension of our learning! At Taiping Park, we observe lush trees and wildlife habitats to practice SDG 15 (Life on Land). Meanwhile, exercising with the park's fitness equipment and walkways promotes SDG 3 (Good Health and Well-being), creating a sustainable and health-conscious community for everyone!","avatar":"images/guide-avatar.jpg","sdgs":[15,3],"audio":{"en":"audio/scene-12-en.m4a","zh-TW":"audio/scene-12-zh.m4a"}},"layers":[{"id":"layer-a1611fc1","name":"Hotspots","visible":true,"locked":false,"hotspots":[]}]}],"skin":{},"runtime":{"autoRotate":{"enabled":false,"speed":0.5,"idleDelayMs":4000},"gyroscope":true,"fullscreenButton":true,"audio":{"muted":false},"startSceneId":"scene-campus"},"i18n":{"zh-TW":{"tour.title":"太平國小 — SDGs 永續校園之旅","tour.description":"太平國小 360° 環景之旅，帶你走訪校園內外十二個地點，一起認識聯合國永續發展目標（SDGs）。","quiz.title":"SDGs 小測驗","scene-3e82a2df.name":"校門口","scene-3e82a2df.guide.text":"校門口的「陳厝厝排水」是守護校園的安全英雄！透過認識這套在地防洪系統，我們學習 SDG 11 永續城鄉 的精神——了解公共設施如何在極端氣候與暴雨下快速排水，並透過遵守防災避難引導，共同打造具備氣候韌性且安全的生活環境。","scene-34f7225f.name":"老榕樹","scene-34f7225f.guide.text":"歡迎來到大榕樹爺爺的懷抱！這棵數十年老樹是學校的守護神，也是厲害的「固碳大師」。在這裡我們探討 SDG 13 氣候行動，學習樹木如何透過「固碳」吸收二氧化碳來減緩地球暖化，並在日常生活中實踐碳中和的綠色行動。","scene-5394d213.name":"運動場","scene-5394d213.guide.text":"廣闊的操場不只是運動場，更是守護生命的防災演練場與社區共享空間！結合 SDG 11 永續城鄉 的精神，我們在這裡練習地震避難與疏散，作為「緊急疏散匯集點」；同時開放社區使用促進「資源共享」，讓太平國小成為安全且包容的永續基地。","scene-1d51c639.name":"籃球場","scene-1d51c639.guide.text":"快來籃球場大顯身手吧！規律運動是實踐 SDG 3 健康與福祉 的最好方式。在籃球場上揮灑汗水不僅能提升「心肺耐力與體能」，運動時大腦分泌的「多巴胺與內啡肽」更能帶來愉悅心情！讓我們透過團隊運動鍛鍊身心，擁抱健康每一天。","scene-81fae87e.name":"馬賽克壁畫","scene-81fae87e.guide.text":"這是一座充滿藝術氣息的廁所！由師生共創的馬賽克壁畫，將藝術與 SDG 6 淨水與衛生完美結合。我們在這裡學習珍惜水資源並保持良好衛生，用創意妝點校園，提升生活美感教育 。","scene-8060da4d.name":"食農教育園地","scene-8060da4d.guide.text":"太平小農夫開工囉！在校園菜園裡，我們親手播種與採收，體驗「從產地到餐桌」的樂趣。透過 SDG 2 消除飢餓，我們學習關注糧食安全與珍惜食物；更透過優先選擇「在地生產的季節食物」，有效減少碳足跡與運輸成本，成為愛護地球的食育實踐者！","scene-fd0f73b6.name":"溫室與廚餘堆肥","scene-fd0f73b6.guide.text":"溫室是植物的成長樂園！在這裡我們觀察豐富植栽，實踐 SDG 15 陸域生態，透過綠化校園創造友善棲地、保護生物多樣性。同時，我們將午餐剩菜進行「廚餘堆肥」，轉化為有機肥料讓資源循環，落實 SDG 12 責任消費與生產，讓廢棄物變寶貝！","scene-c21d4c68.name":"英語情境教室","scene-c21d4c68.guide.text":"Hello world! 歡迎來到英語國際教室！在師資團隊的帶領下，我們結合雙語學習與 SDGs 情境，打造趣味橫生的 SDG 4 優質教育 環境。學校更提供免費課後輔導與英語資源，照顧需要幫忙的同學，實踐 SDG 10 減少不平等 的精神，讓每位小朋友都能享有公平的學習機會，成為具備國際視野的小公民！","scene-6c7a40d5.name":"健康中心","scene-6c7a40d5.guide.text":"健康中心關心每位小朋友的健康！透過「樂活健康報」宣導勤洗手、預防腸病毒與流感，並由護理師指導視力保健與飯後正確潔牙。我們在這裡學習照顧自己與他人，實踐 SDG 3 健康與福祉 的精神，讓校園充滿活力與健康！","scene-7668802a.name":"遊戲場與健康步道","scene-7668802a.guide.text":"穿好布鞋，我們一起出發！遊戲場是大家下課最愛的歡樂天地，旁邊的健康步道更有榕樹、大葉山欖與黑板樹綠意圍繞。在這裡運動賞樹，不僅實踐 SDG 3 健康與福祉，養成天天運動的好習慣，更帶給我們充滿活力的永續能量！","scene-0ec3e426.name":"東天宮","scene-0ec3e426.guide.text":"走出校門，我們來到社區的信仰核心——東天宮！這裡主殿供奉「五聖恩主」，側殿更供奉保佑考運與文運的「文昌帝君」。透過認識東天宮的歷史與神明信仰，我們實踐 SDG 11 永續城鄉 保護在地文化遺產的精神，促進學校與社區共好，傳承珍貴的在地記憶！","scene-b9f1857c.name":"太平公園","scene-b9f1857c.guide.text":"公園是校園學習的自然延伸！在太平公園，我們不僅能觀察茂密樹木與生物棲地，落實 SDG 15 陸域生態；更能利用公園內的健身器材與健康步道放鬆身心、勤加運動，實踐 SDG 3 健康與福祉，打造自然永續且全人健康的幸福社區！","q01.prompt":"太平國小校門口的「陳厝厝排水溝」，主要功能是什麼？","q01a.text":"當作戲水池，讓大家放學後可以跳進去玩滑水道","q01b.text":"在大雨和颱風時快速把雨水排走，保護學校和社區不淹水","q01c.text":"當作垃圾場，讓路人可以把便當盒丟進去","q01d.text":"收集雨水做成人工瀑布，讓校門口更氣派","q02.prompt":"當氣候變遷帶來驚人的暴雨、排水溝水位快速上升時，哪一個做法最符合 SDG 11 打造安全韌性社區的精神？","q02a.text":"拿手機跑到排水溝邊拍短影片，看看有沒有大魚被沖上岸","q02b.text":"遠離危險區域，並遵守學校的防洪疏散指示","q02c.text":"把腳踏車推到排水溝邊清洗，順便「測試」防洪做得好不好","q02d.text":"號召同學爬上校門口的圍牆，對著排水溝大聲唱歌祈求雨停","q03.prompt":"大樹如何幫助我們對抗氣候變遷？","q03a.text":"吸收二氧化碳","q03b.text":"製造塑膠","q03c.text":"增加空氣汙染","q03d.text":"讓地球變得更熱","q04.prompt":"樹木長大時會吸收二氧化碳，把「碳」變成木材、樹皮和樹根，鎖在自己身體裡。這個過程叫做什麼？","q04a.text":"碳排放","q04b.text":"碳封存（固碳）","q04c.text":"碳稅","q04d.text":"碳交易","q05.prompt":"地震發生時，運動場在防災避難中扮演什麼角色？","q05a.text":"躲藏的地方","q05b.text":"緊急集合點","q05c.text":"遊樂區","q05d.text":"儲藏室","q06.prompt":"運動場除了學生使用，也開放給社區居民運動。這展現了什麼價值？","q06a.text":"浪費空間","q06b.text":"資源共享","q06c.text":"隱私外洩","q06d.text":"封閉管理","q07.prompt":"在籃球場規律且適度的運動，可以改善健康的哪一個面向？","q07a.text":"視力","q07b.text":"記憶力","q07c.text":"心肺耐力和體適能","q07d.text":"聽力","q08.prompt":"運動時身體釋放哪些物質，會讓人覺得快樂？","q08a.text":"多巴胺／腦內啡","q08b.text":"二氧化碳","q08c.text":"毒素","q08d.text":"脂肪","q09.prompt":"哪一個行為最符合 SDG 6「潔淨水與衛生」？","q09a.text":"刷牙時讓水一直流","q09b.text":"把垃圾沖進馬桶","q09c.text":"節約用水並保持廁所整潔","q09d.text":"把油倒進水槽","q10.prompt":"校園馬賽克壁畫的下半部，一雙巨手小心翼翼地捧起一棵茂盛的「生命之樹」。這幅圖主要想告訴我們什麼永續訊息？","q10a.text":"提醒我們用自己的雙手珍惜並保護身邊的自然生命，就像照顧一棵大樹一樣","q10b.text":"告訴我們這是一棵神奇的樹，只要對它拍手就會自己長出果實","q10c.text":"建議同學打掃校園時，要用手把所有的樹連根拔起","q10d.text":"意思是放學後大家可以用雙手爬上樹枝去抓松鼠和小鳥","q11.prompt":"學習食農教育有助於解決 SDG 2 中的哪一個問題？","q11a.text":"性別平等","q11b.text":"糧食安全與飢餓","q11c.text":"能源危機","q11d.text":"失業","q12.prompt":"選擇在地生產的當季食材，可以減少：","q12a.text":"營養","q12b.text":"碳足跡和運輸成本","q12c.text":"食物的美味","q12d.text":"可耕地","q13.prompt":"學校溫室裡種滿綠色植物。如果我們好好照顧它們、定時澆水、保護它們生長的家，讓綠色植物多一個安心生長的空間，這是在實踐聯合國的哪一個永續發展目標（SDG）？","q13a.text":"陸域生態：保護植物和土壤裡的小生物","q13b.text":"節能減碳：隨手關燈、少吹冷氣","q13c.text":"潔淨水源：不浪費水、保持水質乾淨","q13d.text":"減少廢棄物：少用塑膠袋、確實做好回收","q14.prompt":"營養午餐後，老師帶大家把吃剩的菜飯做成「廚餘堆肥」，當作小菜園的肥料。這樣化腐朽為神奇，是在實踐哪一個永續發展目標（SDG）？","q14a.text":"潔淨能源：多多利用太陽能和風力發電","q14b.text":"負責任的消費與生產：珍惜食物、減少浪費，讓資源循環利用","q14c.text":"水下生態：保護海裡的小魚和珊瑚礁","q14d.text":"消除貧窮：幫助吃不飽、沒有錢的人","q15.prompt":"我們學校有很棒的英語情境教室，外師 Jovel 和兩位本國老師每天認真又熱情地教英語，讓每個孩子都能建立實用的英語能力。學校提供這麼好的學習環境，是在實踐哪一個永續發展目標（SDG）？","q15a.text":"優質教育：讓每個人都能快樂上學，獲得豐富的知識和技能","q15b.text":"潔淨水與衛生：確保每個人都有乾淨的自來水可以喝","q15c.text":"消除飢餓：準備營養午餐讓大家都吃得飽","q15d.text":"陸域生態：保護校園裡的鳥類、昆蟲和樹木","q16.prompt":"放學後學校辦理課後照顧班。對於需要協助的弱勢學生，學校不但讓他們免費參加，還在英語情境教室開設免費英語班，讓每個人都有機會把英語學好。這份貼心又公平的關懷，是在實踐哪一個永續發展目標（SDG）？","q16a.text":"陸域生態：在校園多種樹、不傷害昆蟲","q16b.text":"氣候行動：隨手關燈、少吹冷氣來保護地球","q16c.text":"減少不平等：幫助需要幫助的人，讓每個人都有公平的學習機會","q16d.text":"潔淨能源：用屋頂太陽能板發電","q17.prompt":"健康中心每個月的「健康生活報報」都教大家勤洗手，預防腸病毒和流感。保護自己也保護同學不生病，讓大家健健康康、活力滿滿 —— 這是在實踐哪一個永續發展目標（SDG）？","q17a.text":"優質教育：每天認真上課、認真寫作業","q17b.text":"健康與福祉：生病時在家休息、勤洗手，不讓病毒傳播出去","q17c.text":"氣候行動：多走路、少坐車來保護地球","q17d.text":"潔淨水與衛生：不浪費水、保持飲用水乾淨","q18.prompt":"護理師常常提醒大家：「不要看手機太久，讓眼睛休息一下」，也教大家「飯後要確實刷牙、使用牙線」。她是在幫助大家達成哪一個永續發展目標（SDG）？","q18a.text":"消除飢餓：把盤子裡的食物吃光光不浪費","q18b.text":"健康與福祉：保護眼睛不近視、保護牙齒不蛀牙，讓身體健健康康","q18c.text":"陸域生態：愛護校園裡的小樹、不摘花","q18d.text":"可負擔的潔淨能源：隨手關燈關冷氣來節省電力","q19.prompt":"永續發展目標（SDGs）包含 17 項核心目標和 169 項細項目標，其中一項是健康與福祉：促進各年齡層的健康生活。我們校園有很多促進健康的場所，吸引居民在清晨、傍晚和假日前來運動，例如籃球場、運動場和跑道。下列哪一個也是學生下課後最喜歡的地方？","q19a.text":"教室","q19b.text":"遊戲場","q19c.text":"校門口","q19d.text":"廁所","q20.prompt":"太平國小遊戲場旁邊有一條長長的健康步道，清晨、傍晚和假日常常吸引許多居民前來運動。下列哪一種樹木，在健康步道旁「找不到」？","q20a.text":"榕樹","q20b.text":"大葉山欖","q20c.text":"黑板樹","q20d.text":"紫薇","q21.prompt":"東天宮是本校學區太平村的主廟，是一座歷史悠久的廟宇，主祀五聖恩主。下列哪一位神明「不是」其中之一？","q21a.text":"關聖帝君","q21b.text":"玄天上帝","q21c.text":"太子元帥（哪吒）","q21d.text":"阿彌陀佛","q22.prompt":"東天宮位於太平國小學區內的太平路 72 號，正殿主祀五聖恩主，後殿供奉觀音菩薩。側殿除了福德正神之外，還供奉一位神明，紀念生前熱心行善、救人於危難、助人於困頓的張亞子。許多學生大考前會到廟裡祈求金榜題名、考試順利，相傳玉皇大帝敕封他為文昌帝君。由此可以推論，他掌管的是什麼？","q22a.text":"公平正義、明察秋毫、驅邪避凶","q22b.text":"慈悲為懷、庇佑眾生","q22c.text":"民間信仰中的文運、考試與學業成就","q22d.text":"地方居民的平安與健康","q23.prompt":"埔心鄉的「太平公園」有許多美麗的樹木，枝葉茂密、隨風輕輕搖曳。如果我們好好照顧公園裡的樹木，讓它們健康長大，這符合聯合國永續發展目標（SDGs）中保護「陸域生態」的意義嗎？","q23a.text":"符合 —— 樹木是陸域生態重要的一部分，保護它們能讓地球更健康","q23b.text":"不符合 —— 只有保護森林裡的樹才算，公園裡的樹不算","q23c.text":"不符合 —— 保護樹木和陸域生態沒有關係","q23d.text":"不符合 —— 我們只需要保護動物，不用保護植物","q24.prompt":"埔心鄉的「太平公園」有美麗的樹木，還有健身器材和健康步道，讓大家可以一邊欣賞風景一邊運動。政府興建這些設施，是為了讓阿公阿嬤和我們大家都能運動、變得更健康。這符合「健康與福祉（促進所有人的健康生活）」這項永續發展目標嗎？","q24a.text":"符合 —— 提供運動空間會鼓勵大家多動一動、變得更健康","q24b.text":"不符合 —— 去公園只算休閒娛樂，和健康沒有關係","q24c.text":"不符合 —— SDGs 只關心保護大自然，不管人的健康","q24d.text":"不符合 —— 只有生病去醫院才算達成健康目標"}},"quiz":{"enabled":true,"title":"SDG Check","feedback":"immediate","retries":0,"gate":"scene","shuffleAnswers":true,"questions":[{"id":"q01","prompt":"What is the main function of the “Chencuocuo Drainage Canal” at the gate of Taiping Elementary School?","kind":"single","answers":[{"id":"q01a","text":"To be a water playground, so everyone can jump in and slide after school"},{"id":"q01b","text":"To carry stormwater away quickly during heavy rain and typhoons, protecting the school and community from flooding","correct":true},{"id":"q01c","text":"To be a garbage dump, so passers-by can toss their lunch boxes into it"},{"id":"q01d","text":"To collect rainwater and make an artificial waterfall, so the school gate looks more magnificent"}],"sceneId":"scene-3e82a2df","points":1},{"id":"q02","prompt":"When climate change brings a terrifying rainstorm and the water level in the canal rises quickly, which action best matches the SDG 11 spirit of building a safe and resilient community?","kind":"single","answers":[{"id":"q02a","text":"Run to the canal with your phone to film short videos, and watch whether any big fish get washed ashore"},{"id":"q02b","text":"Stay away from the danger zone and follow the school's flood-evacuation instructions","correct":true},{"id":"q02c","text":"Push your bike over to the canal to wash it, just to “test” how well the flood control works"},{"id":"q02d","text":"Gather your classmates to climb the wall by the gate and sing loudly at the canal, praying for the rain to stop"}],"sceneId":"scene-3e82a2df","points":1},{"id":"q03","prompt":"How can big trees help us fight climate change?","kind":"single","answers":[{"id":"q03a","text":"By absorbing carbon dioxide","correct":true},{"id":"q03b","text":"By producing plastic"},{"id":"q03c","text":"By increasing air pollution"},{"id":"q03d","text":"By making the Earth hotter"}],"sceneId":"scene-34f7225f","points":1},{"id":"q04","prompt":"As trees grow, they take in carbon dioxide and turn the “carbon” into wood, bark, and roots, locking it inside their bodies. What is this called?","kind":"single","answers":[{"id":"q04a","text":"Carbon emission"},{"id":"q04b","text":"Carbon sequestration","correct":true},{"id":"q04c","text":"Carbon tax"},{"id":"q04d","text":"Carbon trading"}],"sceneId":"scene-34f7225f","points":1},{"id":"q05","prompt":"During an earthquake, what role does the sports field play in disaster evacuation?","kind":"single","answers":[{"id":"q05a","text":"Hiding place"},{"id":"q05b","text":"Emergency assembly point","correct":true},{"id":"q05c","text":"Amusement area"},{"id":"q05d","text":"Storage room"}],"sceneId":"scene-5394d213","points":1},{"id":"q06","prompt":"The sports field is used by students and is also open to community residents for exercise. What value does this reflect?","kind":"single","answers":[{"id":"q06a","text":"Waste of space"},{"id":"q06b","text":"Resource sharing","correct":true},{"id":"q06c","text":"Privacy leak"},{"id":"q06d","text":"Closed management"}],"sceneId":"scene-5394d213","points":1},{"id":"q07","prompt":"Regular, moderate exercise on the basketball court can improve which aspect of health?","kind":"single","answers":[{"id":"q07a","text":"Eyesight"},{"id":"q07b","text":"Memory"},{"id":"q07c","text":"Cardiorespiratory endurance and fitness","correct":true},{"id":"q07d","text":"Hearing"}],"sceneId":"scene-1d51c639","points":1},{"id":"q08","prompt":"What substances released during exercise make people feel happy?","kind":"single","answers":[{"id":"q08a","text":"Dopamine / endorphins","correct":true},{"id":"q08b","text":"Carbon dioxide"},{"id":"q08c","text":"Toxins"},{"id":"q08d","text":"Fat"}],"sceneId":"scene-1d51c639","points":1},{"id":"q09","prompt":"Which action best supports SDG 6 — Clean Water and Sanitation?","kind":"single","answers":[{"id":"q09a","text":"Let the water run while brushing your teeth"},{"id":"q09b","text":"Flush trash down the toilet"},{"id":"q09c","text":"Save water and keep the restroom clean","correct":true},{"id":"q09d","text":"Pour oil into the sink"}],"sceneId":"scene-81fae87e","points":1},{"id":"q10","prompt":"In the lower half of the campus mosaic mural, a pair of giant hands carefully holds up a flourishing “Tree of Life.” What sustainability message is this image mainly trying to tell us?","kind":"single","answers":[{"id":"q10a","text":"It reminds us to use our own hands to cherish and protect the natural life around us, just as we would care for a great tree","correct":true},{"id":"q10b","text":"It tells us this is a magical tree that will grow fruit all by itself if you clap at it"},{"id":"q10c","text":"It suggests that when students clean the campus, they should pull up all the trees by the roots with their hands"},{"id":"q10d","text":"It means that after school everyone can climb the branches with both hands to catch squirrels and birds"}],"sceneId":"scene-81fae87e","points":1},{"id":"q11","prompt":"Learning about agri-food education helps solve which problem in SDG 2?","kind":"single","answers":[{"id":"q11a","text":"Gender equality"},{"id":"q11b","text":"Food security and hunger","correct":true},{"id":"q11c","text":"Energy crisis"},{"id":"q11d","text":"Unemployment"}],"sceneId":"scene-8060da4d","points":1},{"id":"q12","prompt":"Choosing locally produced, seasonal food can reduce:","kind":"single","answers":[{"id":"q12a","text":"Nutrition"},{"id":"q12b","text":"Carbon footprint and transport costs","correct":true},{"id":"q12c","text":"Food taste"},{"id":"q12d","text":"Arable land"}],"sceneId":"scene-8060da4d","points":1},{"id":"q13","prompt":"The school greenhouse is full of green plants. If we take good care of them — watering them regularly and protecting the home they grow in, giving green plants one more space to thrive — which UN Sustainable Development Goal (SDG) are we practicing?","kind":"single","answers":[{"id":"q13a","text":"Life on Land: protecting plants and the small creatures living in the soil","correct":true},{"id":"q13b","text":"Energy saving and carbon reduction: turning off lights and using less air-conditioning"},{"id":"q13c","text":"Clean water: not wasting water and keeping it clean"},{"id":"q13d","text":"Waste reduction: using fewer plastic bags and recycling properly"}],"sceneId":"scene-fd0f73b6","points":1,"sdgs":[15]},{"id":"q14","prompt":"After the school lunch, teachers lead everyone to turn leftover vegetables and rice into “kitchen-waste compost,” used as fertilizer for the small garden. Turning trash into treasure like this practices which UN Sustainable Development Goal (SDG)?","kind":"single","answers":[{"id":"q14a","text":"Clean energy: making more use of solar and wind power"},{"id":"q14b","text":"Responsible Consumption and Production: cherishing food, reducing waste, and keeping resources circulating","correct":true},{"id":"q14c","text":"Life Below Water: protecting the little fish and coral reefs in the sea"},{"id":"q14d","text":"No Poverty: helping people who don't have enough to eat or enough money"}],"sceneId":"scene-fd0f73b6","points":1,"sdgs":[12]},{"id":"q15","prompt":"Our school has a wonderful English international classroom, where foreign teacher Jovel and two local teachers work earnestly and enthusiastically every day to teach English, so that every child builds practical English skills. By providing such a great learning environment, which UN Sustainable Development Goal (SDG) is the school practicing?","kind":"single","answers":[{"id":"q15a","text":"Quality Education: letting everyone enjoy school and gain rich knowledge and skills","correct":true},{"id":"q15b","text":"Clean Water and Sanitation: making sure everyone has clean tap water to drink"},{"id":"q15c","text":"Zero Hunger: preparing school lunches so everyone eats their fill"},{"id":"q15d","text":"Life on Land: protecting the birds, insects, and trees on campus"}],"sceneId":"scene-c21d4c68","points":1,"sdgs":[4]},{"id":"q16","prompt":"After school, the school runs an after-school care class. For disadvantaged students who need support, the school not only lets them join for free, but also opens a free English class in the English international classroom, so everyone has the chance to learn English well. This thoughtful and fair care practices which UN Sustainable Development Goal (SDG)?","kind":"single","answers":[{"id":"q16a","text":"Life on Land: planting more trees on campus and not harming insects"},{"id":"q16b","text":"Climate Action: turning off lights and using less air-conditioning to protect the Earth"},{"id":"q16c","text":"Reduced Inequalities: helping those who need it, so everyone has a fair chance to learn","correct":true},{"id":"q16d","text":"Clean Energy: generating electricity with rooftop solar panels"}],"sceneId":"scene-c21d4c68","points":1,"sdgs":[10]},{"id":"q17","prompt":"Every month, the Health Center's “Happy Living Health News” teaches everyone to wash their hands often to prevent enterovirus and the flu. Protecting yourself and your classmates from getting sick, so everyone stays healthy and full of energy — which UN Sustainable Development Goal (SDG) does this practice?","kind":"single","answers":[{"id":"q17a","text":"Quality Education: attending class and doing homework diligently every day"},{"id":"q17b","text":"Good Health and Well-Being: resting at home when sick and washing hands often to stop viruses from spreading","correct":true},{"id":"q17c","text":"Climate Action: walking more and riding in cars less to protect the Earth"},{"id":"q17d","text":"Clean Water and Sanitation: not wasting water and keeping drinking water clean"}],"sceneId":"scene-6c7a40d5","points":1},{"id":"q18","prompt":"The school nurse often reminds everyone: “Don't spend too long looking at your phone — let your eyes rest,” and teaches everyone to “brush properly and use dental floss after meals.” Which UN Sustainable Development Goal (SDG) is she helping everyone achieve?","kind":"single","answers":[{"id":"q18a","text":"Zero Hunger: finishing every bit of food on your plate without waste"},{"id":"q18b","text":"Good Health and Well-Being: protecting your eyes from myopia and your teeth from cavities, keeping your body healthy","correct":true},{"id":"q18c","text":"Life on Land: loving the small trees on campus and not picking flowers"},{"id":"q18d","text":"Affordable and Clean Energy: turning off lights and air-conditioning to save electricity"}],"sceneId":"scene-6c7a40d5","points":1},{"id":"q19","prompt":"The Sustainable Development Goals (SDGs) include 17 core goals and 169 targets. Among them is health and well-being: promoting healthy lives for people of all ages. Our campus has many places that promote health, attracting residents to come and exercise in the early morning, evening, and on holidays — for example the basketball court, sports field, and running track. Which of the following is also the place students love most after class?","kind":"single","answers":[{"id":"q19a","text":"Classroom"},{"id":"q19b","text":"Playground","correct":true},{"id":"q19c","text":"School gate"},{"id":"q19d","text":"Restroom"}],"sceneId":"scene-7668802a","points":1},{"id":"q20","prompt":"Next to the playground of Taiping Elementary School is a long health trail. In the early morning, evening, and on holidays it often attracts many residents who come to exercise. Which of the following trees is NOT found along the health trail?","kind":"single","answers":[{"id":"q20a","text":"Banyan tree"},{"id":"q20b","text":"Formosan nato tree (Palaquium formosanum)"},{"id":"q20c","text":"Blackboard tree (Alstonia scholaris)"},{"id":"q20d","text":"Crape myrtle (Lagerstroemia)","correct":true}],"sceneId":"scene-7668802a","points":1},{"id":"q21","prompt":"Dongtian Temple, the main temple of Taiping Village in our school district, is a temple with a long history. It enshrines the Five Sacred Lords (Wu Sheng Enzhu). Which of the following deities is NOT one of them?","kind":"single","answers":[{"id":"q21a","text":"Guan Sheng Dijun (Lord Guan)"},{"id":"q21b","text":"Xuantian Shangdi (Supreme Emperor of the Dark Heaven)"},{"id":"q21c","text":"Taizi Yuanshuai (Marshal Prince Nezha)"},{"id":"q21d","text":"Amitabha Buddha","correct":true}],"sceneId":"scene-0ec3e426","points":1},{"id":"q22","prompt":"Dongtian Temple is located at No. 72, Taiping Road, within the Taiping Elementary School district. Its main hall enshrines the Five Sacred Lords, and its rear hall enshrines Guanyin Bodhisattva. Besides Fude Zhengshen (the Earth God), the side hall also enshrines one more deity, commemorating Zhang Yazi, who was devoted to good deeds during his lifetime — rescuing people from danger and helping those in need. Many students visit the temple before big exams to pray for success and smooth test-taking, and legend says the Jade Emperor appointed him as Wenchang Dijun. From this, we can infer that he is a deity in charge of what?","kind":"single","answers":[{"id":"q22a","text":"Fairness and justice, seeing every detail, and warding off evil"},{"id":"q22b","text":"Compassion and the protection of all people"},{"id":"q22c","text":"Literary fortune, examinations, and scholarly achievement in folk belief","correct":true},{"id":"q22d","text":"The peace and health of local residents"}],"sceneId":"scene-0ec3e426","points":1},{"id":"q23","prompt":"In Puxin Township's “Taiping Park” there are many beautiful trees, their lush leaves swaying gently in the wind. If we take good care of the trees in the park so they grow up healthy, does this match the meaning of protecting “Life on Land” in the UN Sustainable Development Goals (SDGs)?","kind":"single","answers":[{"id":"q23a","text":"Yes — trees are an important part of life on land; protecting them helps make the Earth healthier","correct":true},{"id":"q23b","text":"No — only protecting trees in the forest counts; trees in a park don't"},{"id":"q23c","text":"No — protecting trees has nothing to do with life on land"},{"id":"q23d","text":"No — we only need to protect animals, not plants"}],"sceneId":"scene-b9f1857c","points":1,"sdgs":[15]},{"id":"q24","prompt":"Puxin Township's “Taiping Park” has beautiful trees, plus fitness equipment and a health trail, so everyone can enjoy the scenery while exercising. The government built these facilities so that grandpas, grandmas, and all of us can exercise and get healthier. Does this match the SDG of “Good Health and Well-Being (promoting healthy lives for everyone)”?","kind":"single","answers":[{"id":"q24a","text":"Yes — providing space for exercise encourages everyone to move more and become healthier","correct":true},{"id":"q24b","text":"No — going to the park only counts as entertainment and has nothing to do with health"},{"id":"q24c","text":"No — the SDGs only care about protecting nature, not people's health"},{"id":"q24d","text":"No — only going to the hospital when you are sick counts toward the health goal"}],"sceneId":"scene-b9f1857c","points":1,"sdgs":[3]}]},"logo":"images/school-logo.png"}</script>
